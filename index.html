<!DOCTYPE html>
<html lang="ru">
 <head>
  <title>Отметки студента по токену</title><meta charset="utf-8">
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
    h2 { margin-top: 2rem; border-bottom: 2px solid #eee; padding-bottom: .3rem; }
    table { width: 100%; border-collapse: collapse; margin-top: .5rem; }
    th, td { border: 1px solid #ccc; padding: .4rem .7rem; text-align: left; font-size: .95rem; }
    th { background: #f2f2f2; }
    tr:nth-child(even) { background: #fafafa; }
    .grade { font-weight: 600; }
    .grade.empty { color: #999; font-weight: 400; }
    #status { color: #666; margin-top: .5rem; }
    label { display: block; margin-top: .5rem; }
    input { padding: .3rem; }
    button { margin-top: .5rem; padding: .4rem .9rem; }
    .course-total { font-weight: 700; background: #eef5ff; }
  </style>
  <script>
    const MOODLE_ORIGIN = "https://node-server.ru";

    async function getToken(username, password) {
      const res = await (await fetch(MOODLE_ORIGIN + "/m/login/token.php?service=moodle_mobile_app", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: "username=" + encodeURIComponent(username) + "&password=" + encodeURIComponent(password)
      })).json();
      if (res.error) throw new Error(res.error);
      return res.token;
    }

    async function callApi(token, wsfunction, params) {
      const url = new URL(MOODLE_ORIGIN + "/m/webservice/rest/server.php");
      url.searchParams.set("moodlewsrestformat", "json");
      url.searchParams.set("wstoken", token);
      url.searchParams.set("wsfunction", wsfunction);
      for (const [key, value] of Object.entries(params || {})) url.searchParams.set(key, value);
      const res = await (await fetch(url)).json();
      if (res && res.exception) throw new Error(res.message || res.errorcode);
      return res;
    }

    async function getScore() {
      const status = document.querySelector('#status');
      const out = document.querySelector('#output');
      status.textContent = 'Загрузка…';
      out.innerHTML = '';
      try {
        const username = document.querySelector('#username').value;
        const password = document.querySelector('#password').value;
        const token = await getToken(username, password);

        const siteInfo = await callApi(token, 'core_webservice_get_site_info');
        const userid = siteInfo.userid;

        const myCourses = await callApi(token, 'core_enrol_get_users_courses', { userid });
        const sortedCourses = myCourses.slice().sort((a, b) => a.fullname.localeCompare(b.fullname, 'ru'));

        status.textContent = 'Загрузка оценок по ' + sortedCourses.length + ' курсам…';

        let totalItems = 0;
        for (const course of sortedCourses) {
          let data;
          try {
            data = await callApi(token, 'gradereport_user_get_grade_items', { courseid: course.id, userid });
          } catch (e) {
            continue; // курс без доступного журнала оценок у этого пользователя
          }
          const ug = data.usergrades && data.usergrades[0];
          if (!ug) continue;

          const items = ug.gradeitems.filter(gi => gi.itemtype === 'mod');
          const courseTotal = ug.gradeitems.find(gi => gi.itemtype === 'course');
          if (!items.length && (!courseTotal || courseTotal.gradeformatted === '-')) continue;

          totalItems += items.length;
          const section = document.createElement('section');
          const h2 = document.createElement('h2');
          h2.textContent = escapeHtml(course.fullname);
          section.append(h2);

          const table = document.createElement('table');
          table.innerHTML = '<thead><tr><th>Задание</th><th>Оценка</th><th>Диапазон</th></tr></thead>';
          const tbody = document.createElement('tbody');
          for (const gi of items) {
            const tr = document.createElement('tr');
            const isEmpty = gi.gradeformatted === '-' || gi.gradeformatted == null;
            tr.innerHTML = '<td>' + escapeHtml(gi.itemname || '(без названия)') + '</td>' +
              '<td class="grade' + (isEmpty ? ' empty' : '') + '">' + escapeHtml(gi.gradeformatted ?? '—') + '</td>' +
              '<td>' + escapeHtml((gi.rangeformatted || '').replace('&ndash;', '-')) + '</td>';
            tbody.append(tr);
          }
          if (courseTotal) {
            const tr = document.createElement('tr');
            tr.className = 'course-total';
            tr.innerHTML = '<td>Итог по курсу</td>' +
              '<td class="grade">' + escapeHtml(courseTotal.gradeformatted ?? '—') + '</td>' +
              '<td>' + escapeHtml((courseTotal.rangeformatted || '').replace('&ndash;', '-')) + '</td>';
            tbody.append(tr);
          }
          table.append(tbody);
          section.append(table);
          out.append(section);
        }

        status.textContent = out.children.length
          ? 'Готово. Курсов с заданиями: ' + out.children.length + ', элементов оценивания: ' + totalItems + '.'
          : 'Готово. Ни в одном курсе нет доступных элементов оценивания с результатом.';
      } catch (err) {
        status.textContent = 'Ошибка: ' + err.message;
      }
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }
  </script>
 </head>
 <body>
  <main>
    <h1>Получить отметки студента в курсах</h1>
    <label>Логин <input id="username" autocomplete="username"></label>
    <label>Пароль <input id="password" type="password" autocomplete="current-password"></label>
    <button onclick="getScore()">Поехали</button>
    <p id="status"></p>
    <div id="output"></div>
  </main>
 </body>
</html>
