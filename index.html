<!DOCTYPE html>
<html lang="ru">
 <head>
  <title>Отметки студента по токену</title><meta charset="utf-8">
  <style>
    :root {
      --pink-50: #fff0f6;
      --pink-100: #ffd9e8;
      --pink-300: #ff8fb8;
      --pink-500: #e8457a;
      --pink-600: #c73867;
      --ink: #3a1626;
      --ink-soft: #8a5a70;
      --card-bg: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      max-width: 820px;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 4rem;
      background: linear-gradient(180deg, var(--pink-50), #fff 320px);
      color: var(--ink);
    }
    h1 {
      font-size: 1.9rem;
      margin: 0 0 1.5rem;
      background: linear-gradient(90deg, var(--pink-600), var(--pink-500));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    h2 {
      margin: 2.2rem 0 .6rem;
      color: var(--pink-600);
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      gap: .5rem;
    }
    h2::before { content: "🎀"; font-size: 1rem; }
    .login-card {
      background: var(--card-bg);
      border: 1px solid var(--pink-100);
      border-radius: 18px;
      padding: 1.4rem 1.6rem;
      box-shadow: 0 10px 30px -18px rgba(232, 69, 122, .45);
    }
    label { display: block; margin-top: .9rem; font-size: .85rem; color: var(--ink-soft); font-weight: 600; }
    input {
      width: 100%;
      margin-top: .35rem;
      padding: .6rem .8rem;
      border: 1.5px solid var(--pink-100);
      border-radius: 10px;
      font-size: 1rem;
      background: #fffafc;
      color: var(--ink);
    }
    input:focus { outline: none; border-color: var(--pink-500); box-shadow: 0 0 0 3px var(--pink-100); }
    input.invalid { border-color: #e24b6b; background: #fff2f4; }
    .field-error { color: #c7264a; font-size: .78rem; margin-top: .3rem; display: none; }
    .field-error.show { display: block; }
    button {
      margin-top: 1.1rem;
      padding: .65rem 1.4rem;
      border: none;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--pink-500), var(--pink-600));
      color: #fff;
      font-weight: 700;
      font-size: .95rem;
      cursor: pointer;
      box-shadow: 0 8px 18px -8px rgba(199, 56, 103, .6);
    }
    button:hover { filter: brightness(1.05); }
    button:active { transform: translateY(1px); }
    #status { color: var(--ink-soft); margin-top: .8rem; font-size: .9rem; }
    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      margin-top: .5rem;
      background: var(--card-bg);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 6px 20px -14px rgba(232, 69, 122, .35);
    }
    th, td { padding: .55rem .8rem; text-align: left; font-size: .92rem; border-bottom: 1px solid var(--pink-50); }
    th { background: var(--pink-100); color: var(--pink-600); font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; }
    tr:last-child td { border-bottom: none; }
    tr:nth-child(even) td { background: #fff7fa; }
    .grade { font-weight: 700; color: var(--pink-600); }
    .grade.empty { color: #c9a9b7; font-weight: 400; }
    .course-total td { font-weight: 700; background: var(--pink-50) !important; }
  </style>
  <script>
    function normalizeMoodleBase(raw) {
      let base = (raw || '').trim().replace(/\/+$/, '');
      if (!/^https?:\/\//i.test(base)) base = 'https://' + base;
      return base;
    }

    function isValidHttpUrl(raw) {
      try {
        const u = new URL(normalizeMoodleBase(raw));
        return u.protocol === 'https:' || u.protocol === 'http:';
      } catch {
        return false;
      }
    }

    function setFieldError(inputId, errorId, message) {
      const input = document.querySelector('#' + inputId);
      const err = document.querySelector('#' + errorId);
      if (message) {
        input.classList.add('invalid');
        err.textContent = message;
        err.classList.add('show');
      } else {
        input.classList.remove('invalid');
        err.classList.remove('show');
      }
      return !message;
    }

    function validateForm() {
      const moodleurl = document.querySelector('#moodleurl').value;
      const username = document.querySelector('#username').value;
      const password = document.querySelector('#password').value;

      const urlOk = setFieldError('moodleurl', 'moodleurl-error',
        !moodleurl.trim() ? 'Укажите адрес Moodle.' :
        !isValidHttpUrl(moodleurl) ? 'Это не похоже на адрес сайта.' : '');
      const userOk = setFieldError('username', 'username-error',
        !username.trim() ? 'Укажите логин.' : '');
      const passOk = setFieldError('password', 'password-error',
        !password ? 'Укажите пароль.' : '');

      return urlOk && userOk && passOk;
    }

    async function getToken(moodleBase, username, password) {
      const res = await (await fetch(moodleBase + "/login/token.php?service=moodle_mobile_app", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: "username=" + encodeURIComponent(username) + "&password=" + encodeURIComponent(password)
      })).json();
      if (res.error) throw new Error(res.error);
      return res.token;
    }

    async function callApi(moodleBase, token, wsfunction, params) {
      const url = new URL(moodleBase + "/webservice/rest/server.php");
      url.searchParams.set("moodlewsrestformat", "json");
      url.searchParams.set("wstoken", token);
      url.searchParams.set("wsfunction", wsfunction);
      for (const [key, value] of Object.entries(params || {})) url.searchParams.set(key, value);
      const res = await (await fetch(url)).json();
      if (res && res.exception) throw new Error(res.message || res.errorcode);
      return res;
    }

    async function getScore() {
      const status = document.querySelector('#status');
      const out = document.querySelector('#output');
      out.innerHTML = '';

      if (!validateForm()) {
        status.textContent = 'Проверьте поля, выделенные красным.';
        return;
      }

      status.textContent = 'Загрузка…';
      try {
        const moodleBase = normalizeMoodleBase(document.querySelector('#moodleurl').value);
        const username = document.querySelector('#username').value;
        const password = document.querySelector('#password').value;
        let token;
        try {
          token = await getToken(moodleBase, username, password);
        } catch (e) {
          setFieldError('username', 'username-error', '');
          setFieldError('password', 'password-error', 'Проверьте логин и пароль.');
          status.textContent = 'Не удалось войти: ' + e.message;
          return;
        }

        const siteInfo = await callApi(moodleBase, token, 'core_webservice_get_site_info');
        const userid = siteInfo.userid;

        const myCourses = await callApi(moodleBase, token, 'core_enrol_get_users_courses', { userid });
        const sortedCourses = myCourses.slice().sort((a, b) => a.fullname.localeCompare(b.fullname, 'ru'));

        status.textContent = 'Загрузка оценок по ' + sortedCourses.length + ' курсам…';

        let totalItems = 0;
        for (const course of sortedCourses) {
          let data;
          try {
            data = await callApi(moodleBase, token, 'gradereport_user_get_grade_items', { courseid: course.id, userid });
          } catch (e) {
            continue; // курс без доступного журнала оценок у этого пользователя
          }
          const ug = data.usergrades && data.usergrades[0];
          if (!ug) continue;

          const items = ug.gradeitems.filter(gi => gi.itemtype === 'mod');
          const courseTotal = ug.gradeitems.find(gi => gi.itemtype === 'course');
          if (!items.length && (!courseTotal || courseTotal.gradeformatted === '-')) continue;

          totalItems += items.length;
          const section = document.createElement('section');
          const h2 = document.createElement('h2');
          h2.textContent = escapeHtml(course.fullname);
          section.append(h2);

          const table = document.createElement('table');
          table.innerHTML = '<thead><tr><th>Задание</th><th>Оценка</th><th>Диапазон</th></tr></thead>';
          const tbody = document.createElement('tbody');
          for (const gi of items) {
            const tr = document.createElement('tr');
            const isEmpty = gi.gradeformatted === '-' || gi.gradeformatted == null;
            tr.innerHTML = '<td>' + escapeHtml(gi.itemname || '(без названия)') + '</td>' +
              '<td class="grade' + (isEmpty ? ' empty' : '') + '">' + escapeHtml(gi.gradeformatted ?? '—') + '</td>' +
              '<td>' + escapeHtml((gi.rangeformatted || '').replace('&ndash;', '-')) + '</td>';
            tbody.append(tr);
          }
          if (courseTotal) {
            const tr = document.createElement('tr');
            tr.className = 'course-total';
            tr.innerHTML = '<td>Итог по курсу</td>' +
              '<td class="grade">' + escapeHtml(courseTotal.gradeformatted ?? '—') + '</td>' +
              '<td>' + escapeHtml((courseTotal.rangeformatted || '').replace('&ndash;', '-')) + '</td>';
            tbody.append(tr);
          }
          table.append(tbody);
          section.append(table);
          out.append(section);
        }

        status.textContent = out.children.length
          ? 'Готово. Курсов с заданиями: ' + out.children.length + ', элементов оценивания: ' + totalItems + '.'
          : 'Готово. Ни в одном курсе нет доступных элементов оценивания с результатом.';
      } catch (err) {
        status.textContent = 'Ошибка: ' + err.message;
      }
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }
  </script>
 </head>
 <body>
  <main>
    <h1>Получить отметки студента в курсах</h1>
    <div class="login-card">
      <label>Адрес Moodle <input id="moodleurl" value="https://node-server.ru/m" placeholder="https://node-server.ru/m"></label>
      <p class="field-error" id="moodleurl-error"></p>
      <label>Логин <input id="username" autocomplete="username"></label>
      <p class="field-error" id="username-error"></p>
      <label>Пароль <input id="password" type="password" autocomplete="current-password"></label>
      <p class="field-error" id="password-error"></p>
      <button onclick="getScore()">Поехали ✨</button>
      <p id="status"></p>
    </div>
    <div id="output"></div>
  </main>
 </body>
</html>
